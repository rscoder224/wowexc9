    <!-- DISTRIBUTOR Text -->
    <text x="240" y="315" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#1E40AF" text-anchor="middle" letter-spacing="4">DISTRIBUTOR</text>
  </g>
</svg>
